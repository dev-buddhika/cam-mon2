<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="theme-color" content="#0d1117">
<title>Wallet</title>
<style>
:root{--bg:#0d1117;--card:#161b24;--cell:#1d2430;--line:#262e3c;--tx:#f1f4f9;--mut:#8791a5;--inc:#4fd1a1;--exp:#ff7a70;--acc:#7c8cff}
[data-theme=light]{--bg:#f3f5f9;--card:#fff;--cell:#eef1f6;--line:#dfe4ec;--tx:#141a26;--mut:#6b7488;--inc:#0f9d6b;--exp:#e0483d;--acc:#4f5fe8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mo{display:flex;align-items:center;gap:6px}
.mo b{font-size:20px;min-width:140px;text-align:center}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);font-size:18px}
.hero{background:var(--card);border-radius:22px;padding:20px 18px 16px;margin-bottom:12px}
.hero small{color:var(--mut);font-size:13px}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:2px 0 14px}
.bar{height:8px;border-radius:4px;background:var(--exp);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--inc);width:50%;transition:width .3s}
.two{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.two small{display:block;font-weight:500;margin-bottom:2px}
.all{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.all b{font-size:17px}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.card{background:var(--card);border-radius:22px;padding:14px 10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;color:var(--mut);font-size:11px;padding-bottom:6px}
.d{height:50px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.d span{font-size:9px;font-weight:700;height:11px}
.d.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.d.sel{background:var(--acc);color:#fff}
.d.sel span{color:#fff}
.d.blank{visibility:hidden}
.h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 6px 8px}
.h b{font-size:17px}.h small{color:var(--mut)}
.rec{display:flex;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.dot{width:38px;height:38px;border-radius:12px;background:var(--cell);display:grid;place-items:center;font-size:18px}
.rec .t{flex:1;min-width:0}.rec .t b{display:block;font-size:15px}.rec .t small{color:var(--mut)}
.rec .a{font-weight:800}
.rec button{border:0;background:none;color:var(--mut);font-size:16px;padding:6px}
.empty{text-align:center;color:var(--mut);padding:18px 0;font-size:14px}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(env(safe-area-inset-bottom) + 22px);width:62px;height:62px;border-radius:22px;border:0;background:var(--acc);color:#fff;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.bk.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .25s ease;z-index:11}
.sheet.on{transform:none}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--cell);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:11px;border-radius:11px;font-size:15px;font-weight:700}
.seg .on.i{background:var(--inc);color:#06241a}.seg .on.e{background:var(--exp);color:#2b0805}
.amt{width:100%;border:0;background:none;font-size:44px;font-weight:800;text-align:center;color:var(--tx);outline:none;margin-bottom:6px;font-family:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--cell);border-radius:20px;padding:8px 13px;font-size:14px}
.chips .on{background:var(--acc);border-color:var(--acc);color:#fff}
.in{width:100%;padding:14px;margin-bottom:10px;border-radius:14px;border:0;background:var(--cell);color:var(--tx);font-size:16px;font-family:inherit}
.save{width:100%;padding:16px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:700}
.sec{background:var(--cell);color:var(--tx);border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;width:100%;margin-bottom:8px}
textarea.in{height:90px;font-size:13px;resize:none}
.note{color:var(--mut);font-size:13px;margin:0 0 12px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mo"><button class="ib" id="prev">‹</button><b id="title"></b><button class="ib" id="next">›</button></div>
    <button class="ib" id="gear">⚙︎</button>
  </div>

  <section class="hero">
    <small>Net balance this month</small>
    <div class="big" id="mn">Rs. 0</div>
    <div class="bar"><i id="barf"></i></div>
    <div class="two">
      <div><small>Income</small><span class="pos" id="mi">Rs. 0</span></div>
      <div style="text-align:right"><small>Expense</small><span class="neg" id="me">Rs. 0</span></div>
    </div>
    <div class="all"><span>All-time balance</span><b id="all">Rs. 0</b></div>
  </section>

  <section class="card"><div class="grid" id="grid"></div></section>

  <section class="card">
    <div class="h"><b id="dayt"></b><small id="dayn"></small></div>
    <div id="list"></div>
  </section>
</div>

<button class="fab" id="fab" aria-label="Add transaction">+</button>
<div class="bk" id="bk"></div>

<div class="sheet" id="addS">
  <div class="grip"></div>
  <div class="seg"><button class="i on" id="bi">Income</button><button class="e" id="be">Expense</button></div>
  <input class="amt" id="amt" type="number" inputmode="decimal" placeholder="0.00">
  <div class="chips" id="chips"></div>
  <input class="in" id="desc" type="text" placeholder="Note (optional)">
  <input class="in" id="date" type="date">
  <button class="save" id="save">Save transaction</button>
</div>

<div class="sheet" id="setS">
  <div class="grip"></div>
  <button class="sec" id="theme">Switch theme</button>
  <p class="note">Backup: copy your data and keep it in Notes. Restore: paste it back below.</p>
  <textarea class="in" id="bkTxt" placeholder="Backup text appears here"></textarea>
  <button class="sec" id="copy">Copy backup</button>
  <button class="sec" id="restore">Restore from text</button>
</div>

<script>
const KEY="financeTrackerData",TH="walletTheme";
let data=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ds=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const money=n=>(n<0?"-":"")+"Rs. "+Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:2});
const short=n=>{const a=Math.abs(n);return (n>0?"+":"-")+(a>=1000?(a/1000).toFixed(a>=10000?0:1)+"k":a)};
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const CATS={income:["💼 Salary","🏪 Business","🎁 Gift","➕ Other"],expense:["🍜 Food","🚌 Transport","🏠 Home","💡 Bills","🛍 Shopping","💊 Health","➖ Other"]};
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),sel=ds(Y,M,now.getDate()),type="income",cat="";

function render(){
  $("title").textContent=MN[M]+" "+Y;
  const pre=`${Y}-${pad(M+1)}`;let inc=0,exp=0,all=0;
  data.forEach(t=>{all+=t.type==="income"?t.amount:-t.amount;if(t.date.startsWith(pre))t.type==="income"?inc+=t.amount:exp+=t.amount});
  const net=inc-exp;
  $("mi").textContent=money(inc);$("me").textContent=money(exp);
  $("mn").textContent=money(net);$("mn").className="big "+(net>=0?"pos":"neg");
  $("all").textContent=money(all);$("all").className=all>=0?"pos":"neg";
  $("barf").style.width=(inc+exp?inc/(inc+exp)*100:50)+"%";
  const g=$("grid");g.innerHTML="";
  ["M","T","W","T","F","S","S"].forEach(d=>g.insertAdjacentHTML("beforeend",`<div class="dow">${d}</div>`));
  const first=(new Date(Y,M,1).getDay()+6)%7,days=new Date(Y,M+1,0).getDate();
  for(let i=0;i<first;i++)g.insertAdjacentHTML("beforeend",'<div class="d blank"></div>');
  const td=ds(now.getFullYear(),now.getMonth(),now.getDate());
  for(let d=1;d<=days;d++){
    const k=ds(Y,M,d),rows=data.filter(t=>t.date===k);
    const s=rows.reduce((a,t)=>a+(t.type==="income"?t.amount:-t.amount),0);
    const b=document.createElement("button");
    b.className="d"+(k===sel?" sel":"")+(k===td?" today":"");
    b.innerHTML=`${d}<span class="${s>=0?"pos":"neg"}">${rows.length&&s?short(s):""}</span>`;
    b.onclick=()=>{sel=k;render()};g.appendChild(b);
  }
  const rows=data.filter(t=>t.date===sel);
  const dt=new Date(sel+"T00:00");
  $("dayt").textContent=dt.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  $("dayn").textContent=rows.length?rows.length+" record"+(rows.length>1?"s":""):"";
  const l=$("list");l.innerHTML=rows.length?"":'<div class="empty">Nothing here yet. Tap + to add.</div>';
  rows.forEach(t=>{
    const r=document.createElement("div");r.className="rec";
    const ic=(t.cat||(t.type==="income"?"➕":"➖")).split(" ")[0];
    const nm=t.desc||(t.cat?t.cat.split(" ").slice(1).join(" "):(t.type==="income"?"Income":"Expense"));
    r.innerHTML=`<div class="dot">${ic}</div><div class="t"><b></b><small>${t.type==="income"?"Income":"Expense"}</small></div><div class="a ${t.type==="income"?"pos":"neg"}">${t.type==="income"?"+":"-"}${money(t.amount).replace("Rs. ","")}</div>`;
    r.querySelector("b").textContent=nm;
    const x=document.createElement("button");x.textContent="✕";
    x.onclick=()=>{if(confirm("Delete this record?")){data=data.filter(z=>z.id!==t.id);save();render()}};
    r.appendChild(x);l.appendChild(r);
  });
}
function chips(){
  const c=$("chips");c.innerHTML="";
  CATS[type].forEach(n=>{const b=document.createElement("button");b.textContent=n;if(n===cat)b.className="on";
    b.onclick=()=>{cat=cat===n?"":n;chips()};c.appendChild(b)});
}
function setType(t){type=t;cat="";$("bi").classList.toggle("on",t==="income");$("be").classList.toggle("on",t==="expense");chips()}
let open=null;
function show(id){open=id;$(id).classList.add("on");$("bk").classList.add("on")}
function hide(){if(open)$(open).classList.remove("on");$("bk").classList.remove("on");open=null;document.activeElement.blur()}
$("bk").onclick=hide;
$("fab").onclick=()=>{$("date").value=sel;setType(type);show("addS");setTimeout(()=>$("amt").focus(),250)};
$("gear").onclick=()=>{$("bkTxt").value="";show("setS")};
$("bi").onclick=()=>setType("income");$("be").onclick=()=>setType("expense");
$("save").onclick=()=>{
  const a=parseFloat($("amt").value);if(!a||a<=0){$("amt").focus();return}
  const d=$("date").value||sel;
  data.push({id:Date.now(),date:d,type,amount:a,desc:$("desc").value.trim(),cat});
  save();sel=d;const p=d.split("-");Y=+p[0];M=+p[1]-1;
  $("amt").value="";$("desc").value="";cat="";hide();render();
};
function shift(n){M+=n;if(M<0){M=11;Y--}if(M>11){M=0;Y++}sel=ds(Y,M,1);render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
function theme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==="light"?"#f3f5f9":"#0d1117";try{localStorage.setItem(TH,t)}catch(e){}}
let th="dark";try{th=localStorage.getItem(TH)||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}
theme(th);
$("theme").onclick=()=>theme(document.documentElement.dataset.theme==="light"?"dark":"light");
$("copy").onclick=async()=>{const t=JSON.stringify(data);$("bkTxt").value=t;try{await navigator.clipboard.writeText(t);$("copy").textContent="Copied ✓"}catch(e){$("bkTxt").select();$("copy").textContent="Select and copy the text"}setTimeout(()=>$("copy").textContent="Copy backup",2500)};
$("restore").onclick=()=>{try{const v=JSON.parse($("bkTxt").value);if(!Array.isArray(v))throw 0;
  if(confirm("Replace current data with "+v.length+" records?")){data=v;save();hide();render()}}catch(e){alert("That text is not a valid backup.")}};
render();
</script>
</body>
</html>
